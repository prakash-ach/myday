<title>Quick Notes · MYDAY</title><style>

.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}input.title{width:100%;font-size:22px;font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 0}

.ci{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;height:78px}.ci img{max-width:100%;max-height:100%;object-fit:contain}.sec.on{border-color:var(--a);color:var(--a)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin:2px;font-size:13px}.wrap.wide{grid-template-columns:1fr}.wrap.wide .side{display:none}

.muted{color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#141a21;color:#fff;padding:9px 16px;border-radius:999px;display:none}
@media print{.side,.row,.toast{display:none}.wrap{display:block}.ai{border:0}}
</style></head><body><div class="wrap"><div class="side"><div class="row"><a class="sec" href="/" style="text-decoration:none">← MYDAY</a><button class="pri" id="new">＋ New</button></div><div id="list"></div></div>
<div class="main" id="main"></div></div><div class="toast" id="toast"></div>
<script>
"use strict";

function list() {

/* ---------- ink: smoothed, variable-width strokes; stroke eraser; shape snap; live read ---------- */

const W = () => cv.getBoundingClientRect().width;

async function doRead() {

  $("#undo").onclick = () => { strokes.pop(); redraw(); dirtyDraw = true; queueSave(); };
  $("#lv").onchange = (e) => { live = e.target.checked; lastRead = ""; if (live) doRead(); else $("#live").innerHTML = ""; };
  $("#lg").onchange = (e) => { lang = e.target.value; lastRead = ""; if (live) doRead(); };
  $("#t").oninput = $("#x").oninput = queueSave;
  $("#wide").onclick = () => { document.querySelector(".wrap").classList.toggle("wide"); $("#wide").textContent = "⤢ " + (document.querySelector(".wrap").classList.contains("wide") ? "Show notes" : "Full screen"); };
  document.querySelectorAll("[data-c]").forEach((b) => (b.onclick = () => { colour = b.dataset.c; eraser = false; document.querySelectorAll("[data-c]").forEach((x) => x.classList.toggle("on", x === b)); $("#er").textContent = "⌫ Eraser"; }));
  $("#er").onclick = () => { eraser = !eraser; $("#er").textContent = eraser ? "✎ Pen" : "⌫ Eraser"; };
  $("#clr").onclick = () => { if (!confirm("Clear the drawing?")) return; strokes = []; cv._bg = null; redraw(); dirtyDraw = true; saveNow(); };
  $("#done").onclick = complete; $("#del").onclick = del; if ($("#back")) $("#back").onclick = () => { showOrig = false; editor(); };
}
function queueSave() { clearTimeout(saveT); const s = $("#st"); if (s) s.textContent = "…"; saveT = setTimeout(saveNow, 900); }
async function saveNow() {
  clearTimeout(saveT); if (!cur || !$("#x")) return;
  const body = { id: cur.id, title: $("#t").value, text: $("#x").value };
  if (dirtyDraw) { body.strokes = strokes; body.drawing = strokes.length || cv._bg ? png() : ""; dirtyDraw = false; }
  try { const j = await api("/api/qn/save", body); Object.assign(cur, j.note); const s = $("#st"); if (s) s.textContent = "saved ✓"; list(); } catch (e) { toast("Couldn't save — " + e.message); }
}

async function complete() {
  if ($("#x")) await saveNow();
  if (!(cur.text || "").trim() && !cur.drawing) return toast("Write or draw something first");
  toast("✨ The AI is organising your note…");
  try { const j = await api("/api/qn/complete", { id: cur.id }); Object.assign(cur, j.note); showOrig = false; list(); editor(); toast("Done — note organised ✓"); } catch (e) { toast("AI couldn't finish: " + e.message); }
}
async function del() { if (!confirm("Delete this note?")) return; await api("/api/qn/delete", { id: cur.id }); notes = notes.filter((x) => x.id !== cur.id); cur = null; list(); editor(); }
$("#new").onclick = async () => { if ($("#x")) await saveNow(); const j = await api("/api/qn/save", { text: "" }); notes.unshift(j.note); cur = j.note; showOrig = true; list(); editor(); $("#x") && $("#x").focus(); };
$("#list").onclick = async (e) => { const b = e.target.closest("[data-id]"); if (!b) return; if ($("#x")) await saveNow(); cur = notes.find((n) => n.id === b.dataset.id); showOrig = cur.status !== "done"; list(); editor(); };
api("/api/qn").then((d) => { notes = d.notes || []; list(); editor(); }).catch((e) => toast(e.message));
</script></body></html>
