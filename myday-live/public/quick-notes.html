<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quick Notes · MYDAY</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#141a21;--muted:#6b7686;--line:#e2e6eb;--a:#2FBF87}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171d24;--ink:#e9edf3;--muted:#8c97a8;--line:#27303a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:100vh}@media (max-width:820px){.wrap{grid-template-columns:1fr}.side{max-height:38vh;overflow:auto}}
.side{border-right:1px solid var(--line);padding:14px;background:var(--card)}.side h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;margin:5px 0;cursor:pointer}
.item small{display:block;color:var(--muted);font-size:12px}.item.on{border-color:var(--a)}
.main{padding:18px;max-width:980px}button{font:inherit;cursor:pointer}.pri{background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700}
.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}input.title{width:100%;font-size:22px;font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 0}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);font:16px/1.5 inherit;resize:vertical}
.pad{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;height:min(56vh,520px);touch-action:none;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}.sw.on{outline:2px solid var(--a)}
.ai{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.ai h1,.ai h2,.ai h3{margin:.6em 0 .3em}.ai table{border-collapse:collapse}.ai td,.ai th{border:1px solid var(--line);padding:4px 8px}
.muted{color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#141a21;color:#fff;padding:9px 16px;border-radius:999px;display:none}
@media print{.side,.row,.toast{display:none}.wrap{display:block}.ai{border:0}}
</style></head><body><div class="wrap"><div class="side"><div class="row"><a class="sec" href="/" style="text-decoration:none">← MYDAY</a><button class="pri" id="new">＋ New</button></div><div id="list"></div></div>
<div class="main" id="main"></div></div><div class="toast" id="toast"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s), esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let notes = [], cur = null, saveT = null, showOrig = false;
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e.t); e.t = setTimeout(() => (e.style.display = "none"), 2200); };
const api = async (u, b) => { const r = await fetch(u, b ? { method: "POST", headers: { "content-type": "application/json" }, credentials: "same-origin", body: JSON.stringify(b) } : { credentials: "same-origin" }); if (r.status === 401) location.href = "/"; const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "HTTP " + r.status); return j; };
const titleOf = (n) => (n.ai && n.ai.title) || n.draftTitle || (n.text || "").split("\n")[0].slice(0, 50) || "Untitled note";
function md(s) {   // small Markdown → HTML (headings, bullets, bold, italics, tables)
  const lines = esc(s).split("\n"); let out = "", list = false, table = false;
  for (const l of lines) {
    if (/^\s*\|.*\|\s*$/.test(l)) { if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue; if (!table) { out += "<table>"; table = true; } out += "<tr>" + l.trim().slice(1, -1).split("|").map((c) => `<td>${c.trim()}</td>`).join("") + "</tr>"; continue; }
    if (table) { out += "</table>"; table = false; }
    const m = l.match(/^\s*[-*]\s+(.*)/); if (m) { if (!list) { out += "<ul>"; list = true; } out += `<li>${m[1]}</li>`; continue; }
    if (list) { out += "</ul>"; list = false; }
    const h = l.match(/^(#{1,3})\s+(.*)/); out += h ? `<h${h[1].length + 1}>${h[2]}</h${h[1].length + 1}>` : l.trim() ? `<p>${l}</p>` : "";
  }
  return (out + (list ? "</ul>" : "") + (table ? "</table>" : "")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
}
function list() {
  const by = (a, b) => titleOf(a).localeCompare(titleOf(b));
  const sect = (h, arr) => arr.length ? `<h2>${h}</h2>` + arr.sort(by).map((n) => `<button class="item ${cur && cur.id === n.id ? "on" : ""}" data-id="${n.id}">${esc(titleOf(n))}<small>${esc((n.completedAt || n.updatedAt || n.createdAt || "").slice(0, 10))}</small></button>`).join("") : "";
  $("#list").innerHTML = sect("Writing", notes.filter((n) => n.status !== "done")) + sect("Completed notes (A–Z)", notes.filter((n) => n.status === "done")) || `<p class="muted">No notes yet — tap ＋ New.</p>`;
}
/* ---------- the pencil: every pen point, smooth curves, pressure, palm rejection ---------- */
let cv, ctx, drawing = false, pts = [], penSeen = false, colour = "#1d2a44", eraser = false, dirtyDraw = false;
function setupPad(dataUrl) {
  cv = $("#cv"); ctx = cv.getContext("2d"); const r = cv.getBoundingClientRect(), dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); ctx.scale(dpr, dpr); ctx.lineCap = ctx.lineJoin = "round";
  if (dataUrl) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = dataUrl; }
  const P = (e) => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top, p: e.pointerType === "pen" ? Math.max(0.1, e.pressure || 0.5) : 0.5 }; };
  cv.onpointerdown = (e) => { if (e.pointerType === "pen") penSeen = true; if (penSeen && e.pointerType === "touch") return; drawing = true; pts = [P(e)]; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = (e) => {
    if (!drawing) return;
    for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) pts.push(P(ev));
    while (pts.length >= 3) {                                     // quadratic curve through midpoints = smooth line
      const [a, b, c] = pts, m1 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, m2 = { x: (b.x + c.x) / 2, y: (b.y + c.y) / 2 };
      ctx.globalCompositeOperation = eraser ? "destination-out" : "source-over"; ctx.strokeStyle = colour;
      ctx.lineWidth = eraser ? 22 : 1.2 + b.p * 3.2; ctx.beginPath(); ctx.moveTo(m1.x, m1.y); ctx.quadraticCurveTo(b.x, b.y, m2.x, m2.y); ctx.stroke(); pts.shift();
    }
  };
  cv.onpointerup = cv.onpointercancel = () => { if (!drawing) return; drawing = false; pts = []; dirtyDraw = true; queueSave(); };
}
function editor() {
  const n = cur; if (!n) { $("#main").innerHTML = `<h1>Quick Notes</h1><p class="muted">Tap ＋ New to start writing. When you're done, tap ✨ Complete note and the AI turns it into a clean, organised note.</p>`; return; }
  if (n.status === "done" && !showOrig) {
    const a = n.ai || {};
    $("#main").innerHTML = `<div class="row"><button class="sec" id="orig">✎ Show my original</button><button class="sec" id="redo">✨ Refine again</button><button class="sec" onclick="print()">🖨 Print</button><button class="sec" id="del">Delete</button></div>
      <div class="ai"><h1 style="margin-top:0">${esc(a.title)}</h1>${a.summary ? `<p class="muted">${esc(a.summary)}</p>` : ""}${md(a.body || "")}
      ${(a.actions || []).length ? `<h3>Next steps</h3><ul>${a.actions.map((x) => `<li>☐ ${esc(x)}</li>`).join("")}</ul>` : ""}
      ${n.drawing ? `<h3>Drawing</h3><img src="${n.drawing}" style="max-width:100%;border:1px solid var(--line);border-radius:10px">${a.drawing ? `<p class="muted">${esc(a.drawing)}</p>` : ""}` : ""}</div>`;
    $("#orig").onclick = () => { showOrig = true; editor(); }; $("#redo").onclick = complete; $("#del").onclick = del; return;
  }
  $("#main").innerHTML = `<input class="title" id="t" placeholder="Title (optional — the AI will name it)" value="${esc(n.draftTitle || "")}">
    <div class="row"><textarea id="x" placeholder="Type quickly — rough is fine…">${esc(n.text || "")}</textarea></div>
    <div class="row"><b>Draw / handwrite</b>${["#1d2a44", "#2563eb", "#dc2626", "#16a34a"].map((c) => `<button class="sw ${colour === c && !eraser ? "on" : ""}" data-c="${c}" style="background:${c}"></button>`).join("")}
      <button class="sec ${eraser ? "on" : ""}" id="er">${eraser ? "✎ Pen" : "⌫ Eraser"}</button><button class="sec" id="clr">Clear drawing</button><span class="muted" id="st"></span></div>
    <div class="pad"><canvas id="cv"></canvas></div>
    <div class="row"><button class="pri" id="done">✨ Complete note</button>${n.status === "done" ? `<button class="sec" id="back">See the AI note</button>` : ""}<button class="sec" id="del">Delete</button></div>`;
  setupPad(n.drawing);
  $("#t").oninput = $("#x").oninput = queueSave;
  document.querySelectorAll("[data-c]").forEach((b) => (b.onclick = () => { colour = b.dataset.c; eraser = false; saveNow().then(editor); }));
  $("#er").onclick = () => { eraser = !eraser; saveNow().then(editor); };
  $("#clr").onclick = () => { if (!confirm("Clear the drawing?")) return; ctx.clearRect(0, 0, cv.width, cv.height); dirtyDraw = true; saveNow(); };
  $("#done").onclick = complete; $("#del").onclick = del; if ($("#back")) $("#back").onclick = () => { showOrig = false; editor(); };
}
function queueSave() { clearTimeout(saveT); const s = $("#st"); if (s) s.textContent = "…"; saveT = setTimeout(saveNow, 900); }
async function saveNow() {
  clearTimeout(saveT); if (!cur || !$("#x")) return;
  const body = { id: cur.id, title: $("#t").value, text: $("#x").value };
  if (dirtyDraw) { body.drawing = blank() ? "" : cv.toDataURL("image/png"); dirtyDraw = false; }
  try { const j = await api("/api/qn/save", body); Object.assign(cur, j.note); const s = $("#st"); if (s) s.textContent = "saved ✓"; list(); } catch (e) { toast("Couldn't save — " + e.message); }
}
function blank() { const d = ctx.getImageData(0, 0, cv.width, cv.height).data; for (let i = 3; i < d.length; i += 4) if (d[i]) return false; return true; }
async function complete() {
  if ($("#x")) await saveNow();
  if (!(cur.text || "").trim() && !cur.drawing) return toast("Write or draw something first");
  toast("✨ The AI is organising your note…");
  try { const j = await api("/api/qn/complete", { id: cur.id }); Object.assign(cur, j.note); showOrig = false; list(); editor(); toast("Done — note organised ✓"); } catch (e) { toast("AI couldn't finish: " + e.message); }
}
async function del() { if (!confirm("Delete this note?")) return; await api("/api/qn/delete", { id: cur.id }); notes = notes.filter((x) => x.id !== cur.id); cur = null; list(); editor(); }
$("#new").onclick = async () => { if ($("#x")) await saveNow(); const j = await api("/api/qn/save", { text: "" }); notes.unshift(j.note); cur = j.note; showOrig = true; list(); editor(); $("#x") && $("#x").focus(); };
$("#list").onclick = async (e) => { const b = e.target.closest("[data-id]"); if (!b) return; if ($("#x")) await saveNow(); cur = notes.find((n) => n.id === b.dataset.id); showOrig = cur.status !== "done"; list(); editor(); };
api("/api/qn").then((d) => { notes = d.notes || []; list(); editor(); }).catch((e) => toast(e.message));
</script></body></html>
