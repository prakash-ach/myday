<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Display · sign in</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1318;color:#e9edf3;font:16px -apple-system,"Segoe UI",Roboto,sans-serif}
form{background:#171d24;border:1px solid #27303a;border-radius:16px;padding:26px;width:min(360px,90vw);display:grid;gap:12px}h1{margin:0 0 4px;font-size:22px}
input{padding:12px;border-radius:10px;border:1px solid #27303a;background:#0f1318;color:#e9edf3;font-size:16px}button{padding:12px;border:0;border-radius:10px;background:#2FBF87;color:#fff;font-weight:700;font-size:16px}
p{margin:0;color:#f2545b;min-height:1.2em}</style></head><body><form id="f"><h1>🖼 Home Display</h1><input id="u" placeholder="Username" autocomplete="username" autocapitalize="none">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button>Sign in</button><p id="e"></p></form>
<script>document.getElementById("f").onsubmit=async(ev)=>{ev.preventDefault();const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify({username:document.getElementById("u").value,password:document.getElementById("pw").value})});
if(r.ok){location.href="/home-display/";}else{const j=await r.json().catch(()=>({}));document.getElementById("e").textContent=j.error||"Couldn't sign in";}};</script></body></html>
